<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f7fc" />
    <title>리그 랭킹 ID</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="rank-card" aria-labelledby="page-title">
        <header class="hero">
          <h1 id="page-title">랭킹 아이디 추출기</h1>
          <p class="hero-copy">버튼을 누르면 해당 리그의 TikTok ID가 순위대로 복사됩니다.</p>
        </header>

        <button id="copy-all" class="copy-all" type="button" disabled>
          전체 리그 ID 복사
        </button>

        <section class="refresh-section" aria-labelledby="refresh-heading">
          <div class="refresh-heading-row">
            <h2 id="refresh-heading">갱신할 리그 선택</h2>
            <div class="refresh-actions">
              <button id="refresh-select-all" type="button">전체 선택</button>
              <button id="refresh-clear-all" type="button">전체 해제</button>
            </div>
          </div>
          <div id="refresh-grid" class="refresh-grid"></div>
          <p id="refresh-selection-count" class="refresh-selection-count">0개 선택</p>
          <button id="manual-refresh" class="manual-refresh" type="button" disabled>
            갱신할 리그를 선택하세요
          </button>
        </section>

        <section class="league-section" aria-labelledby="league-heading">
          <h2 id="league-heading">리그별 ID 복사</h2>
          <div id="league-grid" class="league-grid" aria-busy="true"></div>
        </section>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
