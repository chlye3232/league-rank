name: Refresh league rankings

on:
  schedule:
    # GitHub cron uses UTC: 03:00/15:00 UTC = 12:00/00:00 KST.
    - cron: "0 3,15 * * *"
  workflow_dispatch:
    inputs:
      group:
        description: "League group to refresh"
        required: true
        default: all
        type: choice
        options:
          - all
          - A
          - B
          - C
          - D
      leagues:
        description: "Optional comma-separated leagues (example: A1,B3,D5)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: league-ranking-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Select scheduled league group
        id: group
        shell: bash
        run: |
          requested_leagues="${{ inputs.leagues || '' }}"
          if [ -n "$requested_leagues" ]; then
            value="custom"
          else
            value="${{ inputs.group || 'all' }}"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "선택 그룹: $value"

      - name: Restore private refresh state
        uses: actions/cache/restore@v4
        with:
          path: |
            output/league-anchors.json
            output/retry-state.json
            id_cache.json
            logs/refresh-history.jsonl
          key: league-state-${{ github.run_id }}
          restore-keys: |
            league-state-

      - name: Initialize cached state
        shell: bash
        run: |
          mkdir -p output logs
          if [ ! -f output/league-anchors.json ]; then
            cp seed/league-anchors.json output/league-anchors.json
          fi
          if [ ! -f id_cache.json ] && [ -f seed/id_cache.json ]; then
            cp seed/id_cache.json id_cache.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare league target
        id: target
        shell: bash
        env:
          REQUESTED_LEAGUES: ${{ inputs.leagues || '' }}
        run: |
          if [ -n "$REQUESTED_LEAGUES" ]; then
            python refresh_state.py prepare --leagues "$REQUESTED_LEAGUES"
          else
            python refresh_state.py prepare --group "${{ steps.group.outputs.value }}"
          fi

      - name: Prepare optional purchased proxies
        id: proxies
        shell: bash
        env:
          PROXY_1: ${{ secrets.PROXY_1 }}
          PROXY_2: ${{ secrets.PROXY_2 }}
          PROXY_3: ${{ secrets.PROXY_3 }}
          PROXY_4: ${{ secrets.PROXY_4 }}
          PROXY_5: ${{ secrets.PROXY_5 }}
        run: |
          proxies=""
          count=0
          for value in "$PROXY_1" "$PROXY_2" "$PROXY_3" "$PROXY_4" "$PROXY_5"; do
            [ -z "$value" ] && continue
            echo "::add-mask::$value"
            if [ -z "$proxies" ]; then proxies="$value"; else proxies="$proxies,$value"; fi
            count=$((count + 1))
          done
          echo "PURCHASED_PROXY_URLS=$proxies" >> "$GITHUB_ENV"
          if [ "$count" -gt 0 ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
          echo "구매 프록시: ${count}개"

      - name: Refresh directly without proxy
        id: direct-refresh
        shell: bash
        env:
          TIKTOK_TT_TOKEN: ${{ secrets.TIKTOK_TT_TOKEN }}
          TIKTOK_PROXY_URLS: ""
        run: |
          log_file="logs/run-${GITHUB_RUN_ID}-${{ steps.group.outputs.value }}-direct.log"
          IFS=',' read -r -a leagues <<< "${{ steps.target.outputs.leagues }}"
          args=()
          for league in "${leagues[@]}"; do args+=(--league "$league"); done
          set +e
          python league_rank_updater.py "${args[@]}" --max-tries 50 --delay 0.35 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "log_file=$log_file" >> "$GITHUB_OUTPUT"

      - name: Record direct result
        id: direct-record
        if: always()
        shell: bash
        run: |
          status="${{ steps.direct-refresh.outputs.exit_code }}"
          [ -n "$status" ] || status=1
          python refresh_state.py record-attempt \
            --group "${{ steps.group.outputs.value }}" \
            --phase direct \
            --leagues "${{ steps.target.outputs.leagues }}" \
            --exit-code "$status" \
            --log-file "${{ steps.direct-refresh.outputs.log_file }}"

      - name: Retry direct failures through purchased proxy
        id: proxy-refresh
        if: steps.direct-record.outputs.failed_count != '0' && steps.proxies.outputs.available == 'true'
        shell: bash
        env:
          TIKTOK_TT_TOKEN: ${{ secrets.TIKTOK_TT_TOKEN }}
        run: |
          export TIKTOK_PROXY_URLS="$PURCHASED_PROXY_URLS"
          log_file="logs/run-${GITHUB_RUN_ID}-${{ steps.group.outputs.value }}-proxy.log"
          IFS=',' read -r -a leagues <<< "${{ steps.direct-record.outputs.failed }}"
          args=()
          for league in "${leagues[@]}"; do args+=(--league "$league"); done
          set +e
          python league_rank_updater.py "${args[@]}" --max-tries 50 --delay 0.35 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "log_file=$log_file" >> "$GITHUB_OUTPUT"

      - name: Record proxy result
        id: proxy-record
        if: always() && steps.proxy-refresh.outcome != 'skipped'
        shell: bash
        run: |
          status="${{ steps.proxy-refresh.outputs.exit_code }}"
          [ -n "$status" ] || status=1
          python refresh_state.py record-attempt \
            --group "${{ steps.group.outputs.value }}" \
            --phase proxy \
            --leagues "${{ steps.direct-record.outputs.failed }}" \
            --exit-code "$status" \
            --log-file "${{ steps.proxy-refresh.outputs.log_file }}"

      - name: Select delayed retry target
        id: delayed-target
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.proxy-refresh.outcome }}" != "skipped" ]; then
            leagues="${{ steps.proxy-record.outputs.failed }}"
          else
            leagues="${{ steps.direct-record.outputs.failed }}"
          fi
          if [ -n "$leagues" ]; then needed=true; else needed=false; fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "leagues=$leagues" >> "$GITHUB_OUTPUT"

      - name: Wait five minutes before final retry
        if: steps.delayed-target.outputs.needed == 'true'
        shell: bash
        run: sleep 300

      - name: Final retry after five minutes
        id: delayed-refresh
        if: steps.delayed-target.outputs.needed == 'true'
        shell: bash
        env:
          TIKTOK_TT_TOKEN: ${{ secrets.TIKTOK_TT_TOKEN }}
        run: |
          export TIKTOK_PROXY_URLS="$PURCHASED_PROXY_URLS"
          log_file="logs/run-${GITHUB_RUN_ID}-${{ steps.group.outputs.value }}-delayed.log"
          IFS=',' read -r -a leagues <<< "${{ steps.delayed-target.outputs.leagues }}"
          args=()
          for league in "${leagues[@]}"; do args+=(--league "$league"); done
          set +e
          python league_rank_updater.py "${args[@]}" --max-tries 50 --delay 0.35 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "log_file=$log_file" >> "$GITHUB_OUTPUT"

      - name: Record delayed retry result
        id: delayed-record
        if: always() && steps.delayed-refresh.outcome != 'skipped'
        shell: bash
        run: |
          status="${{ steps.delayed-refresh.outputs.exit_code }}"
          [ -n "$status" ] || status=1
          python refresh_state.py record-attempt \
            --group "${{ steps.group.outputs.value }}" \
            --phase delayed \
            --leagues "${{ steps.delayed-target.outputs.leagues }}" \
            --exit-code "$status" \
            --log-file "${{ steps.delayed-refresh.outputs.log_file }}"

      - name: Build sanitized static site
        if: steps.direct-record.outputs.publish == 'true' || steps.proxy-record.outputs.publish == 'true' || steps.delayed-record.outputs.publish == 'true'
        run: python build_static_site.py

      - name: Upload ranking JSON to Cloudflare KV
        if: steps.direct-record.outputs.publish == 'true' || steps.proxy-record.outputs.publish == 'true' || steps.delayed-record.outputs.publish == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: kv key put rankings --namespace-id=${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }} --path=public/data/rankings.json

      - name: Save private refresh state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            output/league-anchors.json
            output/retry-state.json
            id_cache.json
            logs/refresh-history.jsonl
          key: league-state-${{ github.run_id }}

      - name: Upload private refresh record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-refresh-${{ github.run_id }}-${{ steps.group.outputs.value }}
          path: |
            logs/refresh-history.jsonl
            logs/run-${{ github.run_id }}-*.log
            output/retry-state.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Report unresolved collection failure
        if: always() && steps.delayed-record.outputs.failed_count != '' && steps.delayed-record.outputs.failed_count != '0'
        shell: bash
        run: exit 1
