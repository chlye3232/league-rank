name: Refresh and deploy league rankings

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "22 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: league-ranking-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Determine run mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "22 * * * *" ]; then
            echo "value=retry" >> "$GITHUB_OUTPUT"
          else
            echo "value=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore private refresh state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            output/league-anchors.json
            output/retry-state.json
            id_cache.json
            logs/refresh-history.jsonl
          key: league-state-${{ github.run_id }}
          restore-keys: |
            league-state-

      - name: Initialize cached state
        shell: bash
        run: |
          mkdir -p output
          if [ ! -f output/league-anchors.json ]; then
            cp seed/league-anchors.json output/league-anchors.json
          fi
          if [ ! -f id_cache.json ] && [ -f seed/id_cache.json ]; then
            cp seed/id_cache.json id_cache.json
          fi

      - name: Check retry target
        id: retry-target
        if: steps.mode.outputs.value == 'retry'
        run: python refresh_state.py prepare-retry

      - name: Set up Python
        if: steps.mode.outputs.value == 'full' || steps.retry-target.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector dependencies
        if: steps.mode.outputs.value == 'full' || steps.retry-target.outputs.needed == 'true'
        run: python -m pip install -r requirements.txt

      - name: Prepare proxy rotation
        if: steps.mode.outputs.value == 'full' || steps.retry-target.outputs.needed == 'true'
        shell: bash
        env:
          PROXY_1: ${{ secrets.PROXY_1 }}
          PROXY_2: ${{ secrets.PROXY_2 }}
          PROXY_3: ${{ secrets.PROXY_3 }}
          PROXY_4: ${{ secrets.PROXY_4 }}
          PROXY_5: ${{ secrets.PROXY_5 }}
        run: |
          proxies=""
          for value in "$PROXY_1" "$PROXY_2" "$PROXY_3" "$PROXY_4" "$PROXY_5"; do
            [ -z "$value" ] && continue
            echo "::add-mask::$value"
            if [ -z "$proxies" ]; then proxies="$value"; else proxies="$proxies,$value"; fi
          done
          echo "TIKTOK_PROXY_URLS=$proxies" >> "$GITHUB_ENV"

      - name: Refresh all TikTok leagues
        id: full-refresh
        if: steps.mode.outputs.value == 'full'
        shell: bash
        env:
          TIKTOK_TT_TOKEN: ${{ secrets.TIKTOK_TT_TOKEN }}
        run: |
          mkdir -p logs
          log_file="logs/run-${GITHUB_RUN_ID}-full.log"
          set +e
          python league_rank_updater.py --max-tries 20 --delay 0.35 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "log_file=$log_file" >> "$GITHUB_OUTPUT"

      - name: Record full refresh result
        id: full-record
        if: always() && steps.mode.outputs.value == 'full'
        shell: bash
        run: |
          status="${{ steps.full-refresh.outputs.exit_code }}"
          [ -n "$status" ] || status=1
          python refresh_state.py record-full --exit-code "$status" --log-file "${{ steps.full-refresh.outputs.log_file }}"

      - name: Retry only failed leagues
        id: retry-refresh
        if: steps.mode.outputs.value == 'retry' && steps.retry-target.outputs.needed == 'true'
        shell: bash
        env:
          TIKTOK_TT_TOKEN: ${{ secrets.TIKTOK_TT_TOKEN }}
        run: |
          mkdir -p logs
          log_file="logs/run-${GITHUB_RUN_ID}-retry.log"
          IFS=',' read -r -a leagues <<< "${{ steps.retry-target.outputs.leagues }}"
          args=()
          for league in "${leagues[@]}"; do
            args+=(--league "$league")
          done
          set +e
          python league_rank_updater.py "${args[@]}" --max-tries 20 --delay 0.35 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "log_file=$log_file" >> "$GITHUB_OUTPUT"

      - name: Record and merge retry result
        id: retry-record
        if: always() && steps.mode.outputs.value == 'retry' && steps.retry-target.outputs.needed == 'true'
        shell: bash
        run: |
          status="${{ steps.retry-refresh.outputs.exit_code }}"
          [ -n "$status" ] || status=1
          python refresh_state.py record-retry --exit-code "$status" --log-file "${{ steps.retry-refresh.outputs.log_file }}"

      - name: Build sanitized static site
        if: steps.full-record.outputs.publish == 'true' || steps.retry-record.outputs.publish == 'true'
        run: python build_static_site.py

      - name: Deploy public directory to Cloudflare Pages
        if: steps.full-record.outputs.publish == 'true' || steps.retry-record.outputs.publish == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Save private refresh state
        if: always() && (steps.mode.outputs.value == 'full' || steps.retry-target.outputs.needed == 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            output/league-anchors.json
            output/retry-state.json
            id_cache.json
            logs/refresh-history.jsonl
          key: league-state-${{ github.run_id }}

      - name: Upload private refresh record
        if: always() && (steps.mode.outputs.value == 'full' || steps.retry-target.outputs.needed == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: league-refresh-${{ github.run_id }}
          path: |
            logs/refresh-history.jsonl
            logs/run-${{ github.run_id }}-*.log
            output/retry-state.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Report unresolved collection failure
        if: always() && (steps.full-record.outputs.fatal == 'true' || steps.retry-record.outputs.unresolved == 'true')
        shell: bash
        run: exit 1
